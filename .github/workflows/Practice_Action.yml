name: Actions Practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: 가져오기 전 파일 목록
        run: ls -la

      - name: 저장소 가져오기
        uses: actions/checkout@v7

      - name: 가져온 후 파일 목록
        run: ls -la

      - name: 현재 커밋 확인
        run: git log -1 --oneline

      - name: 연습용 마크다운 파일 만들기
        run: |
          echo "# 자동화 연습" > actions-practice-output.md
          echo "" >> actions-practice-output.md
          echo "이 파일은 러너에서 만들었습니다." >> actions-practice-output.md

      - name: 생성한 파일 내용 확인
        run: cat actions-practice-output.md

      - name: Git 변경 상태 확인
        run: git status --short

name: Actions Practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: 가져오기 전 파일 목록
        run: ls -la

      - name: 저장소 가져오기
        uses: actions/checkout@v7

      - name: 가져온 후 파일 목록
        run: ls -la

      - name: 현재 커밋 확인
        run: git log -1 --oneline
